  engineGain.gain.value = playing ? (0.03 + p * 0.05) : 0;
  noiseGain.gain.value = playing ? (state.offRoad ? 0.06 : p * 0.018) : 0;
}

function beep(freq, dur, type, vol) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type || 'square';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(masterGain || audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}

function playCheckpoint() {
  beep(880, 0.12, 'square', 0.09);
  setTimeout(() => beep(1320, 0.16, 'square', 0.09), 110);
  setTimeout(() => beep(1760, 0.22, 'square', 0.08), 240);
}

function playFinish() {
  const notes = [523, 659, 784, 1046, 1318];
  notes.forEach((f, i) => setTimeout(() => beep(f, 0.26, 'square', 0.09), i * 130));
}

function playCrash() {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(220, audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(55, audioCtx.currentTime + 0.3);
  g.gain.setValueAtTime(0.14, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.32);
  o.connect(g); g.connect(masterGain || audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + 0.34);
}

/* --------------------------- game flow ------------------------------ */
const menuEl = document.getElementById('menu');
const overEl = document.getElementById('gameover');
const overTitle = document.getElementById('overTitle');
const overSub = document.getElementById('overSub');
const overScore = document.getElementById('overScore');
const overStats = document.getElementById('overStats');
const bestText = document.getElementById('bestText');
const retryBtn = document.getElementById('retryBtn');

function startGame() {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  state.mode = 'playing';
  state.position = 0;
  state.playerX = 0;
  state.speed = 0;
  state.distance = 0;
  state.score = 0;
  state.stage = 0;
  state.stageTime = stageBonusTime;
  state.timeLeft = startTime;
  state.stageFlash = 1.8;
  state.hitCooldown = 0;
  state.spin = 0;
  state.slide = 0;
  state.stagesCleared = 0;
  state.totalTime = 0;
  state.finished = false;
  state.finishTimer = 0;
  state.celebT = 0;
  state.menuTimer = 0;
  state.cloudOffset = rnd(0, 40000);      // fresh cloud pattern every run
  state.particles.length = 0;
  resetTraffic();

  menuEl.classList.add('hidden');
  overEl.classList.add('hidden');
}

/* Crossing the finish line of the last stage: the car coasts to a halt, the
   run is scored, and after a short hold the game falls back to the menu. */
function beginFinish() {
  state.finished = true;
  state.mode = 'finishing';
  state.finishTimer = 0;
  state.celebT = 0;
  state.stageFlash = 0;
  state.score += 5000;
  state.timeLeft = Math.max(state.timeLeft, 0);
  playFinish();
}

const CONFETTI = ['#ffd447', '#ff5fa2', '#31c5b5', '#ff7a3a', '#7ec8ff', '#ffffff'];
let confettiTimer = 0;
function updateConfetti(dt) {
  confettiTimer -= dt;
  if (confettiTimer > 0) return;
  confettiTimer = 0.06;
  for (let k = 0; k < 3; k++) {
    state.particles.push({
      x: RES_W / 2 + rnd(-70, 70), y: RES_H / 2 + rnd(-30, 10),
      vx: rnd(-46, 46), vy: rnd(-90, -40),
      life: rnd(1.1, 2.0), maxLife: 2.0,
      size: rnd(1.5, 3), color: pick(CONFETTI)
    });
  }
}

function updateFinishing(dt) {
  state.finishTimer += dt;
  // stand on the brakes until the car is stopped
  state.speed = Math.max(0, state.speed - maxSpeed * 0.9 * dt);
  state.steer += (0 - state.steer) * clamp(dt * 6, 0, 1);
  state.slide = 0;
  state.spin = 0;
  state.position = increase(state.position, dt * state.speed, trackLength);
  if (state.speed <= 0 && state.finishTimer > 1.2) {
    state.mode = 'gameover';
    state.menuTimer = 10;
    showFinishScreen();
  }
}

function showFinishScreen() {
  state.best = Math.max(state.best, Math.floor(state.score));
  localStorage.setItem('outrun-best', String(state.best));
  bestText.textContent = state.best;
  overTitle.textContent = 'Finish!';
  overSub.textContent = 'You cleared every stage';
  overScore.textContent = fmt(state.score, 7);
  overStats.textContent = Math.floor(state.distance / 1000) + ' km  ·  Best ' + state.best;
  retryBtn.classList.add('hidden');       // the menu returns on its own
  overEl.classList.remove('hidden');
}

function showMenu() {
  state.mode = 'menu';
  state.finished = false;
  state.menuTimer = 0;
  state.speed = 0;
  overEl.classList.add('hidden');
  menuEl.classList.remove('hidden');
}

function endGame(crashed) {
  state.mode = 'gameover';
  state.menuTimer = 10;                 // the title menu returns on its own
  state.best = Math.max(state.best, Math.floor(state.score));
  localStorage.setItem('outrun-best', String(state.best));
  bestText.textContent = state.best;

  overTitle.textContent = crashed ? 'Crash!' : 'Time Up';
  overSub.textContent = crashed ? 'Keep your car on the road' : 'The stage was too far this time';
  overScore.textContent = fmt(state.score, 7);
  overStats.textContent = 'Stage ' + (state.stage + 1) + '  ·  ' +
    Math.floor(state.distance / 1000) + ' km  ·  Best ' + state.best;
  retryBtn.classList.remove('hidden');
  overEl.classList.remove('hidden');
}

function onConfirmKey() {
  if (state.mode === 'menu') startGame();
  else if (state.mode === 'gameover' && !state.finished) startGame();
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);

/* ---------------------------- main loop ----------------------------- */
function update(dt) {
  state.wave += dt;
  state.bounce = Math.sin(state.wave * 22) * (state.speed / maxSpeed) * (state.offRoad ? 2.2 : 0.6);

  if (state.mode === 'playing') {
    state.totalTime += dt;
    state.hitCooldown = Math.max(0, state.hitCooldown - dt);
    state.spin = Math.max(0, state.spin - dt * 1.4);

    controlSpeed(dt);
    controlSteering(dt);
    updateProgress(dt);

    const playerSegment = findSegment(state.position + playerZ);
    updateTraffic(dt, playerSegment);
    if (state.hitCooldown <= 0) checkCollision(playerSegment);
  }

  if (state.mode === 'finishing') {
    state.totalTime += dt;
    state.celebT += dt;
    if (state.celebT > 0.9) updateConfetti(dt);
    updateFinishing(dt);
  }

  if (state.mode === 'gameover') {
    // hold the result screen, then fall back to the title menu
    if (state.finished) { state.celebT += dt; updateConfetti(dt); }
    state.menuTimer -= dt;
    if (state.menuTimer <= 0) showMenu();
  }

  state.stageFlash = Math.max(0, state.stageFlash - dt * 0.6);
  state.skyOffset += (findSegment(state.position).curve) * (state.speed / maxSpeed) * dt * 26;
  state.cloudOffset += dt * (4 + (state.speed / maxSpeed) * 10);
  updateParticles(dt);
  updateAudio();
}

function render() {
  renderRoad();
  if (state.mode !== 'menu') drawPlayer();
  drawParticles();
  drawHud();
}

function frame(ts) {
  if (!state.lastTime) state.lastTime = ts;
  let dt = (ts - state.lastTime) / 1000;
  state.lastTime = ts;
  dt = Math.min(dt, 1 / 30);
  update(dt);
  render();
  requestAnimationFrame(frame);
}

/* ------------------------------ layout ------------------------------ */
function fitCanvas() {
  const scale = Math.max(1, Math.min(Math.floor(window.innerWidth / RES_W), Math.floor(window.innerHeight / RES_H)));
  const frame = document.getElementById('frame');
  canvas.style.width = (RES_W * scale) + 'px';
  canvas.style.height = (RES_H * scale) + 'px';
  frame.style.width = (RES_W * scale) + 'px';
  frame.style.height = (RES_H * scale) + 'px';
}
window.addEventListener('resize', fitCanvas);

/* ------------------------------- boot ------------------------------- */
ctx.imageSmoothingEnabled = false;
buildTrack();
resetTraffic();
bestText.textContent = state.best;
fitCanvas();
requestAnimationFrame(frame);
</script>
</body>
</html>
